spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/onlymymoney}
    username: ${SPRING_DATASOURCE_USERNAME:onlymymoney}
    password: ${SPRING_DATASOURCE_PASSWORD:onlymymoney}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
server:
  port: ${SERVER_PORT:8080}
spring.servlet.multipart:
  max-file-size: 10MB
  max-request-size: 10MB
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
